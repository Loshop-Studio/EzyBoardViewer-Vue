name: Release

# 仅当推送形如 v* 的标签时触发，配合本地 `git push --follow-tags`
on:
  push:
    tags:
      - 'v*'

# 最小权限：读代码即可；id-token 用于 npm provenance（证明发布自本仓库 CI）
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # prepublishOnly 会自动执行 `npm run build` 生成 dist
      # 注意：NPM_TOKEN 必须是「勾选了 Bypass 2FA 的 Granular Access Token」，
      # 否则 CI 中 npm publish 会因为需要交互式 OTP 而失败。
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
